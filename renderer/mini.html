<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>HS TIMECODE · Mini</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <link rel="stylesheet" href="mini.css">
</head>
<body>
  <!-- thanh trên trống — chỉ để kéo di chuyển cửa sổ -->
  <div id="miniTopbar" title="Kéo để di chuyển cửa sổ"></div>

  <!-- 1 hàng gọn: TẠM DỪNG trái · GHIM phải -->
  <section id="miniTopRow">
    <span id="miniStatus" class="stv pause">TẠM DỪNG</span>
    <span class="spacer"></span>
    <button id="miniPin" class="pin on" title="Always on Top — cửa sổ luôn nổi trên các cửa sổ khác">📌</button>
  </section>

  <!-- timecode — màu cam, căng giữa -->
  <section id="miniCur">
    <div id="miniTcText">00:00:00:00</div>
  </section>

  <!-- NEXT (cue kế tiếp của bài) + CÒN LẠI — chung 1 hàng, căn giữa -->
  <section id="miniInfo">
    <div class="info-cell">
      <div id="miniNextName" class="info-name"><b>Next:</b> <span id="miniNextLabel">không còn cue</span><span id="miniNextIdx" class="cue-idx"></span></div>
      <div id="miniNextTc" class="info-tc next">--:--:--:--</div>
    </div>
    <div class="info-cell">
      <div class="cell-label">CÒN LẠI</div>
      <div class="info-tc rem" id="miniRem">00:00:00:00</div>
    </div>
  </section>

  <section id="miniProgress">
    <div id="miniBar"><div id="miniBarFill"></div></div>
  </section>

  <section id="miniTransport">
    <button id="mPlay" class="big play" title="PLAY — chạy bài đang chọn">▶</button>
    <button id="mPause" class="big pause" title="PAUSE — tạm dừng">⏸</button>
    <button id="mStop" class="big stop" title="STOP — dừng về đầu">■</button>
  </section>

  <!-- DANH SÁCH BÀI — luôn 2 cột, thấy đầu danh sách, còn lại cuộn -->
  <section id="miniProjects">
    <div class="proj-head"><span>DANH SÁCH BÀI</span><span id="miniProjCount" class="proj-cnt">(0)</span></div>
    <div id="mProjList" class="proj-grid"></div>
  </section>

  <script src="mini.js"></script>
</body>
</html>
